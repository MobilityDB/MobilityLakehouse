[project]
name = "mobility-lakehouse"
version = "0.1.0"
description = "An AIS mobility lakehouse: ingest, process, store, query"
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.4.4",
    "pandas==2.*",
    "pyarrow>=15",
    "requests==2.*",
    "pydantic-settings==2.*",
    "typer==0.12.*",
    "click<8.2",
    "rich==13.*",
    "pyiceberg[sql-sqlite,pyarrow]>=0.8",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.10.9"]
mem = ["psutil"]
dev = ["pytest>=9.0.3"]
# experiments/h3_prefilter: the notebook and h3_iceberg.py
h3 = ["h3>=4", "numpy", "shapely>=2", "pyproj", "matplotlib>=3.10.9"]
# experiments/evaluation: the notebooks that build the figures and tables.
# psycopg2 is only for the two MobilityDB notebooks, contextily only for basemaps.
evaluation = ["numpy", "matplotlib>=3.10.9", "pyproj", "jupyterlab",
              "psycopg2-binary", "contextily"]

[project.scripts]
lakehouse = "lakehouse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse"]
